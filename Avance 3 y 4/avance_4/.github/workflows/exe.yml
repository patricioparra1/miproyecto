name: Generar exe
on: [workflow_dispatch, push]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --name DashboardClimatico --add-data "interfaz;interfaz" --add-data "datos/procesados;datos/procesados" app.py
      - uses: actions/upload-artifact@v4
        with: {name: DashboardClimatico-exe, path: dist/DashboardClimatico.exe}
